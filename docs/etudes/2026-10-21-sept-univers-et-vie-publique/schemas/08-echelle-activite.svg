<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d"><title id="t">L&#x27;échelle de l&#x27;activité</title><desc id="d">Du particulier qui publie une annonce à l&#x27;entreprise gérée dans PRO.GA ; institutions et médias à part.</desc><defs></defs><rect x="0" y="0" width="900" height="640" fill="#FFFFFF"/><rect x="24.0" y="366.0" width="200.0" height="250.0" rx="12" fill="#FFFFFF" stroke="#878787" stroke-width="2" stroke-dasharray="6 4"/><rect x="24.0" y="366.0" width="200.0" height="50.0" rx="12" fill="#878787"/><rect x="24.0" y="396.0" width="200.0" height="20.0" rx="0" fill="#878787"/><g transform="translate(38.0 379.0) scale(1.0000)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g><text x="70.0" y="399.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start">0 · Particulier</text><text x="38.0" y="442.0" font-size="15" font-weight="700" fill="#0A0A0A" text-anchor="start">Je publie une annonce</text><text x="38.0" y="466.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Vendre un frigo, louer mon</text><text x="38.0" y="483.2" font-size="13" font-weight="400" fill="#616161" text-anchor="start">studio, chercher un emploi.</text><text x="38.0" y="500.3" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Profil personnel, contact par</text><text x="38.0" y="517.5" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Messages, sans</text><text x="38.0" y="534.6" font-size="13" font-weight="400" fill="#616161" text-anchor="start">encaissement.</text><text x="38.0" y="563.8" font-size="12.5" font-weight="700" fill="#616161" text-anchor="start">Quand : un besoin ponctuel</text><rect x="38.0" y="580.0" width="125.5" height="22.5" rx="11.25" fill="#FFFFFF" stroke="#878787" stroke-width="1.4"/><text x="100.8" y="595.4" font-size="11.5" font-weight="600" fill="#878787" text-anchor="middle">proposé par l&#x27;étude</text><g transform="translate(220.0 332.0) scale(0.9167)" fill="none" stroke="#007E4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g><rect x="241.0" y="296.0" width="200.0" height="320.0" rx="12" fill="#FFFFFF" stroke="#007E4D" stroke-width="2"/><rect x="241.0" y="296.0" width="200.0" height="50.0" rx="12" fill="#007E4D"/><rect x="241.0" y="326.0" width="200.0" height="20.0" rx="0" fill="#007E4D"/><g transform="translate(255.0 309.0) scale(1.0000)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></g><text x="287.0" y="329.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start">1 · Page d&#x27;activité</text><text x="255.0" y="372.0" font-size="15" font-weight="700" fill="#0A0A0A" text-anchor="start">Je me fais connaître</text><text x="255.0" y="396.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Nom, logo, abonnés,</text><text x="255.0" y="413.2" font-size="13" font-weight="400" fill="#616161" text-anchor="start">publications, Stories,</text><text x="255.0" y="430.3" font-size="13" font-weight="400" fill="#616161" text-anchor="start">directs : une seule identité</text><text x="255.0" y="447.5" font-size="13" font-weight="400" fill="#616161" text-anchor="start">pour l&#x27;activité.</text><text x="255.0" y="476.6" font-size="12.5" font-weight="700" fill="#007E4D" text-anchor="start">Quand : je publie souvent</text><text x="255.0" y="493.1" font-size="12.5" font-weight="700" fill="#007E4D" text-anchor="start">pour mon activité</text><g transform="translate(437.0 262.0) scale(0.9167)" fill="none" stroke="#007E4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g><rect x="458.0" y="226.0" width="200.0" height="390.0" rx="12" fill="#FFFFFF" stroke="#007E4D" stroke-width="2"/><rect x="458.0" y="226.0" width="200.0" height="50.0" rx="12" fill="#007E4D"/><rect x="458.0" y="256.0" width="200.0" height="20.0" rx="0" fill="#007E4D"/><g transform="translate(472.0 239.0) scale(1.0000)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g><text x="504.0" y="259.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start">2 · Page + espaces</text><text x="472.0" y="302.0" font-size="15" font-weight="700" fill="#0A0A0A" text-anchor="start">Je vends en ligne</text><text x="472.0" y="326.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">J&#x27;active Boutique,</text><text x="472.0" y="343.2" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Prestations, Biens,</text><text x="472.0" y="360.3" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Location, Emplois ou Média</text><text x="472.0" y="377.5" font-size="13" font-weight="400" fill="#616161" text-anchor="start">selon mon métier.</text><text x="472.0" y="406.6" font-size="12.5" font-weight="700" fill="#007E4D" text-anchor="start">Quand : ma première offre</text><g transform="translate(654.0 192.0) scale(0.9167)" fill="none" stroke="#007E4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g><rect x="675.0" y="156.0" width="200.0" height="460.0" rx="12" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="675.0" y="156.0" width="200.0" height="50.0" rx="12" fill="#0A0A0A"/><rect x="675.0" y="186.0" width="200.0" height="20.0" rx="0" fill="#0A0A0A"/><g transform="translate(689.0 169.0) scale(1.0000)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="721.0" y="189.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start">3 · Page + PRO.GA</text><text x="689.0" y="232.0" font-size="15" font-weight="700" fill="#0A0A0A" text-anchor="start">Je gère mon entreprise</text><text x="689.0" y="256.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Stock, prix, devis, agenda,</text><text x="689.0" y="273.2" font-size="13" font-weight="400" fill="#616161" text-anchor="start">commandes, factures,</text><text x="689.0" y="290.3" font-size="13" font-weight="400" fill="#616161" text-anchor="start">salariés, encaissement.</text><text x="689.0" y="307.5" font-size="13" font-weight="400" fill="#616161" text-anchor="start">ANTSIA devient un canal.</text><text x="689.0" y="336.6" font-size="12.5" font-weight="700" fill="#007E4D" text-anchor="start">Quand : j&#x27;encaisse, j&#x27;ai du</text><text x="689.0" y="353.1" font-size="12.5" font-weight="700" fill="#007E4D" text-anchor="start">stock ou des salariés</text><text x="24.0" y="34.0" font-size="14" font-weight="700" fill="#2F67B5" text-anchor="start">Hors de l&#x27;échelle commerciale : leur confiance vient d&#x27;une autorité ou d&#x27;une rédaction.</text><rect x="24.0" y="50.0" width="418.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#2F67B5" stroke-width="2"/><g transform="translate(40.0 66.0) scale(1.0000)" fill="none" stroke="#2F67B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></g><text x="74.0" y="84.0" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="start">Page Officielle</text><text x="40.0" y="110.0" font-size="12.5" font-weight="400" fill="#616161" text-anchor="start">Reflet d&#x27;une administration vérifiée d&#x27;administration.ga ; jamais</text><text x="40.0" y="126.5" font-size="12.5" font-weight="400" fill="#616161" text-anchor="start">obtenue en choisissant un modèle de page.</text><rect x="458.0" y="50.0" width="418.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#2F67B5" stroke-width="2"/><g transform="translate(474.0 66.0) scale(1.0000)" fill="none" stroke="#2F67B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></g><text x="508.0" y="84.0" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="start">Page média</text><text x="474.0" y="110.0" font-size="12.5" font-weight="400" fill="#616161" text-anchor="start">Page sociale + site éditorial et rédaction (MP12–MP13) ; badge</text><text x="474.0" y="126.5" font-size="12.5" font-weight="400" fill="#616161" text-anchor="start">Officiel réservé aux institutions.</text></svg>