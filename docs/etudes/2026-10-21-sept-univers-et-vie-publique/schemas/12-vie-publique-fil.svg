<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d"><title id="t">Vie publique : les espaces réservés du fil</title><desc id="d">Officiel, presse, contenus des membres, offres et sponsorisé : chacun à sa place et étiqueté.</desc><defs></defs><rect x="0" y="0" width="900" height="660" fill="#FFFFFF"/><rect x="30.0" y="16.0" width="320.0" height="628.0" rx="34" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="150.0" y="28.0" width="80.0" height="8.0" rx="4" fill="#0A0A0A"/><rect x="46.0" y="56.0" width="288.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#2F67B5" stroke-width="2"/><rect x="46.0" y="56.0" width="288.0" height="30.0" rx="12" fill="#2F67B5"/><rect x="46.0" y="74.0" width="288.0" height="12.0" rx="0" fill="#2F67B5"/><g transform="translate(58.0 61.0) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></g><text x="86.0" y="77.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">Officiel · Communiqué</text><text x="60.0" y="112.0" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="start">Concours : inscriptions ouvertes</text><text x="60.0" y="136.0" font-size="12" font-weight="500" fill="#616161" text-anchor="start" font-style="italic">réservé, jamais payé</text><rect x="46.0" y="166.0" width="288.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#878787" stroke-width="2"/><rect x="46.0" y="166.0" width="288.0" height="30.0" rx="12" fill="#878787"/><rect x="46.0" y="184.0" width="288.0" height="12.0" rx="0" fill="#878787"/><g transform="translate(58.0 171.0) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g><text x="86.0" y="187.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">Membre</text><text x="60.0" y="222.0" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="start">Photo, vidéo, Clip, Story</text><text x="60.0" y="246.0" font-size="12" font-weight="500" fill="#616161" text-anchor="start" font-style="italic">le cœur du fil</text><rect x="46.0" y="276.0" width="288.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#2F67B5" stroke-width="2"/><rect x="46.0" y="276.0" width="288.0" height="30.0" rx="12" fill="#2F67B5"/><rect x="46.0" y="294.0" width="288.0" height="12.0" rx="0" fill="#2F67B5"/><g transform="translate(58.0 281.0) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></g><text x="86.0" y="297.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">Presse · Article</text><text x="60.0" y="332.0" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="start">Média : la une du jour</text><text x="60.0" y="356.0" font-size="12" font-weight="500" fill="#616161" text-anchor="start" font-style="italic">label calculé</text><rect x="46.0" y="386.0" width="288.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#007E4D" stroke-width="2"/><rect x="46.0" y="386.0" width="288.0" height="30.0" rx="12" fill="#007E4D"/><rect x="46.0" y="404.0" width="288.0" height="12.0" rx="0" fill="#007E4D"/><g transform="translate(58.0 391.0) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g><text x="86.0" y="407.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">Offre · Immobilier</text><text x="60.0" y="442.0" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="start">Appartement 2 chambres, Owendo</text><text x="60.0" y="466.0" font-size="12" font-weight="500" fill="#616161" text-anchor="start" font-style="italic">carte d&#x27;offre</text><rect x="46.0" y="496.0" width="288.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="5 4"/><rect x="46.0" y="496.0" width="288.0" height="30.0" rx="12" fill="#0A0A0A"/><rect x="46.0" y="514.0" width="288.0" height="12.0" rx="0" fill="#0A0A0A"/><g transform="translate(58.0 501.0) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></g><text x="86.0" y="517.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">Sponsorisé · payé par…</text><text x="60.0" y="552.0" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="start">Entreprise : nouvelle collection</text><text x="60.0" y="576.0" font-size="12" font-weight="500" fill="#616161" text-anchor="start" font-style="italic">étiqueté, plafonné</text><rect x="46.0" y="592.0" width="288.0" height="36.0" rx="18" fill="#EEEEEE"/><text x="74.0" y="615.0" font-size="11" font-weight="700" fill="#0A0A0A" text-anchor="middle">Fil</text><text x="132.0" y="615.0" font-size="11" font-weight="500" fill="#0A0A0A" text-anchor="middle">Clips</text><text x="190.0" y="615.0" font-size="11" font-weight="500" fill="#0A0A0A" text-anchor="middle">Messages</text><text x="248.0" y="615.0" font-size="11" font-weight="500" fill="#0A0A0A" text-anchor="middle">Découvrir</text><text x="306.0" y="615.0" font-size="11" font-weight="500" fill="#0A0A0A" text-anchor="middle">Profil</text><text x="384.0" y="48.0" font-size="20" font-weight="800" fill="#0A0A0A" text-anchor="start">Règles proposées</text><circle cx="404.0" cy="90.0" r="18.0" fill="#2F67B5"/><g transform="translate(394.1 80.1) scale(0.8250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></g><text x="434.0" y="94.0" font-size="15" font-weight="800" fill="#0A0A0A" text-anchor="start">Officiel</text><text x="434.0" y="116.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Seules les pages d&#x27;administrations reflétées depuis administration.ga ;</text><text x="434.0" y="133.2" font-size="13" font-weight="400" fill="#616161" text-anchor="start">communiqués et alertes en tête, densité limitée ; jamais sponsorisé.</text><circle cx="404.0" cy="180.3" r="18.0" fill="#2F67B5"/><g transform="translate(394.1 170.4) scale(0.8250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10h2"/><path d="M16 14h2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><circle cx="9" cy="11" r="2"/><rect x="2" y="5" width="20" height="14" rx="2"/></g><text x="434.0" y="184.3" font-size="15" font-weight="800" fill="#0A0A0A" text-anchor="start">Agents publics</text><text x="434.0" y="206.3" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Badge Agent public pour un agent volontaire ; il parle en son nom,</text><text x="434.0" y="223.5" font-size="13" font-weight="400" fill="#616161" text-anchor="start">l&#x27;institution parle par sa page.</text><circle cx="404.0" cy="270.6" r="18.0" fill="#2F67B5"/><g transform="translate(394.1 260.7) scale(0.8250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></g><text x="434.0" y="274.6" font-size="15" font-weight="800" fill="#0A0A0A" text-anchor="start">Presse</text><text x="434.0" y="296.6" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Label calculé à partir d&#x27;une attestation ; rédaction, corrections publiques</text><text x="434.0" y="313.8" font-size="13" font-weight="400" fill="#616161" text-anchor="start">; distinct du badge Officiel.</text><circle cx="404.0" cy="361.0" r="18.0" fill="#0A0A0A"/><g transform="translate(394.1 351.1) scale(0.8250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></g><text x="434.0" y="365.0" font-size="15" font-weight="800" fill="#0A0A0A" text-anchor="start">Annonceurs</text><text x="434.0" y="387.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">« Sponsorisé · payé par… », au plus une carte sur dix (à fixer), jamais</text><text x="434.0" y="404.1" font-size="13" font-weight="400" fill="#616161" text-anchor="start">dans Messages, bibliothèque publique des annonces.</text><circle cx="404.0" cy="451.3" r="18.0" fill="#C8102E"/><g transform="translate(394.1 441.4) scale(0.8250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/></g><text x="434.0" y="455.3" font-size="15" font-weight="800" fill="#0A0A0A" text-anchor="start">Politique</text><text x="434.0" y="477.3" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Pas de publicité politique payante ; pages de partis et d&#x27;élus étiquetées ;</text><text x="434.0" y="494.4" font-size="13" font-weight="400" fill="#616161" text-anchor="start">règles renforcées en période électorale.</text><circle cx="404.0" cy="541.6" r="18.0" fill="#007E4D"/><g transform="translate(394.1 531.7) scale(0.8250)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g><text x="434.0" y="545.6" font-size="15" font-weight="800" fill="#0A0A0A" text-anchor="start">Membres</text><text x="434.0" y="567.6" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Contenus classés sans profilage commercial ; aucune donnée de</text><text x="434.0" y="584.8" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Messages ou d&#x27;achat pour le classement public.</text><rect x="384.0" y="606.0" width="22.0" height="12.0" rx="3" fill="#FFFFFF" stroke="#616161" stroke-width="1.4" stroke-dasharray="4 3"/><text x="414.0" y="617.0" font-size="12" font-weight="500" fill="#616161" text-anchor="start">Sponsorisé : n&#x27;existe pas encore ; Officiel, Presse et badges existent en source.</text></svg>