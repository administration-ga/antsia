58.0" y="358.0" width="420.0" height="42.0" rx="10" fill="#F6F6F6"/><g transform="translate(470.0 368.0) scale(0.9167)" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></g><text x="502.0" y="384.0" font-size="13.5" font-weight="600" fill="#0A0A0A" text-anchor="start">Ne paie jamais seul</text><rect x="22.0" y="408.0" width="420.0" height="42.0" rx="10" fill="#F6F6F6"/><g transform="translate(34.0 418.0) scale(0.9167)" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="66.0" y="434.0" font-size="13.5" font-weight="600" fill="#0A0A0A" text-anchor="start">Ne lit ni les Messages privés ni les Rencontres</text><rect x="458.0" y="408.0" width="420.0" height="42.0" rx="10" fill="#F6F6F6"/><g transform="translate(470.0 418.0) scale(0.9167)" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/></g><text x="502.0" y="434.0" font-size="13.5" font-weight="600" fill="#0A0A0A" text-anchor="start">Aucun profilage politique ou sensible</text><rect x="22.0" y="458.0" width="420.0" height="42.0" rx="10" fill="#F6F6F6"/><g transform="translate(34.0 468.0) scale(0.9167)" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g><text x="66.0" y="484.0" font-size="13.5" font-weight="600" fill="#0A0A0A" text-anchor="start">Raisons et sources visibles</text><rect x="458.0" y="458.0" width="420.0" height="42.0" rx="10" fill="#F6F6F6"/><g transfor