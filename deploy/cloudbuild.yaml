# Construction d'une application du moteur par Cloud Build, en contexte
# ECOSYSTEMES (liste blanche : deploy/gcloudignore). Appelé par
# scripts/deploy-app.mjs, qui fournit les substitutions depuis le catalogue et
# l'environnement de la machine qui publie (jamais depuis le dépôt) : TOUTES
# les clés ci-dessous, vides pour les variables d'une autre application
# (substitution stricte : une clé oubliée fait échouer, jamais un bundle vide).
# Chaque variable NEXT_PUBLIC_* du catalogue doit figurer ici (deploy:check).
# Hébergement (Cloud Run ou Vercel) : arbitrage A5, non tranché.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ${_DOCKERFILE}
      - --build-arg
      - NEXT_PUBLIC_CONVEX_URL=${_NEXT_PUBLIC_CONVEX_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_BUILD_SHA=${_NEXT_PUBLIC_BUILD_SHA}
      # Mesure facultative d'antsia_ga : valeurs vides quand elle est désactivée.
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_KEY=${_NEXT_PUBLIC_POSTHOG_KEY}
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_HOST=${_NEXT_PUBLIC_POSTHOG_HOST}
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_EU_RELAY_ORIGIN=${_NEXT_PUBLIC_POSTHOG_EU_RELAY_ORIGIN}
      # Origines facultatives de l’espace démo intégré d’ANTSIA.
      - --build-arg
      - NEXT_PUBLIC_DEMO_ENTRY_ENABLED=${_NEXT_PUBLIC_DEMO_ENTRY_ENABLED}
      - --build-arg
      - NEXT_PUBLIC_APP_BASE_PATH=${_NEXT_PUBLIC_APP_BASE_PATH}
      # Variables propres à diasporale_com : vides pour les autres applications
      # (le plan les passe toutes ; un ARG absent du Dockerfile est ignoré).
      - --build-arg
      - NEXT_PUBLIC_DIASPORALE_DATA_SOURCE=${_NEXT_PUBLIC_DIASPORALE_DATA_SOURCE}
      - --build-arg
      - NEXT_PUBLIC_IDN_PORTAL_URL=${_NEXT_PUBLIC_IDN_PORTAL_URL}
      - --build-arg
      - NEXT_PUBLIC_CONSULATE_URL=${_NEXT_PUBLIC_CONSULATE_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
